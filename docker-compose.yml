version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: ecp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-enterprise_commerce_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-enterprise_commerce_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
        - ecp-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
        - ecp-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-enterprise_commerce_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

      JWT_SECRET: ${JWT_SECRET:-esta-es-una-clave-secreta-muy-larga-y-segura-de-al-menos-32-caracteres}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8080:8080"
    networks:
      - ecp-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  ecp-network:
    driver: bridge
