spring:
  application:
    name: enterprise-commerce-platform

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:esta-es-una-clave-secreta-muy-larga-y-segura-de-al-menos-32-caracteres}
    expiration: ${JWT_EXPIRATION:86400000}
